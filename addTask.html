<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles.css" rel="stylesheet">
        <title> Add Tasks </title>
    </head>
    <body>
        <nav class="navbar">
            <img src="assets/cloudL.png" alt="" class="cloudL">
            <h1> Your Task </h1>
                <div class="signout">
                    <div class="navDiv">
                        <p class="loginStatus" id="unAdd"> Finding User... </p>
                        <button class="logout" id="logoutAdd">
                            <img src="assets/logout.png" alt="Logout"> 
                        </button>
                    </div>
                </div>
            </nav>
        <div id="atBody">
                <div id="addCard">
                    <form id="addDiv">
                        <label class="heading2">Enter the Task’s Title</label><br>
                        <input id="taskTitle" class="paragraph1" required><br>

                        <label class="heading2">Task Description:</label><br>
                        <textarea  id="taskDesc" class="paragraph1" required></textarea><br>

                        <div id="dateAsk">
                            <label class="heading2">Due Date:</label> 
                            <input id="taskDate" type="date" required class="paragraph1"><br>
                        </div>

                        <div id="buttonAdd">
                            <button id="addButton" type="submit" class="paragraph1"> Add Task </button>
                            <button id="backButton"> <img src="assets/back.png"> </button>
                        </div>
                    </form>
                </div>
            </div>
        <script type="module" src="addTask.js" defer></script>
    </body>
</html>
