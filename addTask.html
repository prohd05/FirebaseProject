<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles.css" rel="stylesheet">
        <title> Add Tasks </title>
    </head>
    <body>
        <nav class="navbar">
             <h1> Tasks </h1>
        </nav>
        <div id="atBody">
                <div id="addCard">
                    <form id="addDiv">
                        <label class="heading2">Enter the Task’s Title</label><br>
                        <textarea id="taskTitle" required class="paragraph1"></textarea><br>

                        <label class="heading2">Task Description:</label><br>
                        <textarea id="taskDesc" required class="paragraph1"></textarea><br>

                        <div id="dateAsk">
                        <label class="heading2">Due Date:</label> 
                        <textarea id="taskDate" type="date" required class="paragraph1"></textarea><br>
                        </div>
                
                        <button id="addButton" type="submit" class="paragraph1"> Add Task </button>
                        <button id="backButton" class="paragraph1"> Back </button>
                    </form>
                </div>
            </div>
        <script type="module" src="addTask.js" defer></script>
    </body>
</html>
